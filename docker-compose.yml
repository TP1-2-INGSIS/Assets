services:
  assets:
    build:
      context: .
      dockerfile: Dockerfile
    image: assets:latest
    container_name: assets
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      # Conexión a Azurite dentro de la red de compose (host = nombre del servicio)
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      - AZURE_STORAGE_CONTAINER=snippets
      # Conexión a PostgreSQL dentro de la red de compose (host = nombre del servicio)
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/assets
      - SPRING_DATASOURCE_USERNAME=assets
      - SPRING_DATASOURCE_PASSWORD=assets
      # Agregado para el monitoreo con New Relic
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=assets
    
    depends_on:
      - azurite
      - postgres
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite
    command: "azurite-blob --blobHost 0.0.0.0 --loose"
    ports:
      - "10000:10000"   # Blob service
    volumes:
      - azurite-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: assets-postgres
    environment:
      - POSTGRES_DB=assets
      - POSTGRES_USER=assets
      - POSTGRES_PASSWORD=assets
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  azurite-data:
  postgres-data:
