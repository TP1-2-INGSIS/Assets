name: CD

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build bootJar
        run: ./gradlew bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref_name == 'dev' }}
            type=sha,format=short,prefix=dev-,enable=${{ github.ref_name == 'dev' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=sha,format=short,prefix=,enable=${{ github.ref_name == 'main' }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to the environment
        if: ${{ github.ref_type == 'branch' && (github.ref_name == 'dev' || github.ref_name == 'main') }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ github.ref_name == 'dev' && secrets.DEV_HOST || secrets.PROD_HOST }}
          IMAGE_BASE: ghcr.io/tp1-2-ingsis/assets
        run: |
          # shellcheck disable=SC2029  # IMAGE is meant to expand locally
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::Deploy secrets (DEPLOY_SSH_KEY, DEPLOY_USER, DEV_HOST/PROD_HOST) are not set, skipping deploy"
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_NAME" = "dev" ]; then TAG="dev-$SHORT_SHA"; else TAG="$SHORT_SHA"; fi
          IMAGE="$IMAGE_BASE:$TAG"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          # Host key verification: use the pinned DEPLOY_KNOWN_HOSTS org secret when set.
          # Otherwise trust-on-first-use via ssh-keyscan (still strict afterwards), with a warning.
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set, trusting the host key on first use (ssh-keyscan)"
            ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi
          SSH_OPTS=(-i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"
          for svc in assets-service; do
            rc=0
            out=$(ssh "${SSH_OPTS[@]}" "$TARGET" "docker service inspect snippet-searcher_$svc" 2>&1) || rc=$?
            if [ "$rc" -eq 0 ]; then
              ssh "${SSH_OPTS[@]}" "$TARGET" "docker service update --with-registry-auth --image $IMAGE snippet-searcher_$svc"
            elif printf '%s' "$out" | grep -q "No such service"; then
              echo "::warning::Service snippet-searcher_$svc does not exist in the stack yet, skipping"
            else
              echo "$out"
              exit "$rc"
            fi
          done
