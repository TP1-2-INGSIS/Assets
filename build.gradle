plugins {
	id 'java'
	id 'jacoco'
	id 'checkstyle'
	id 'com.diffplug.spotless' version '8.11.0'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ingsis'
version = '0.0.1-SNAPSHOT'
description = 'assets'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Azure Blob Storage SDK — usado SOLO por el adaptador en storage/azure.
	// El resto del servicio depende de la interfaz BlobStorage, no de Azure.
	implementation 'com.azure:azure-storage-blob:12.36.0'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
	toolVersion = '0.8.12'
}

// Bootstrap only: nothing to unit test in the Spring Boot entry point.
def coverageExclusions = ['com/ingsis/assets/AssetsApplication.class']

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: coverageExclusions)
	}))
}

// The build fails below 80% line coverage.
tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('test')
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: coverageExclusions)
	}))
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

// Formatter: google-java-format. `./gradlew spotlessApply` formats; `check` verifies.
spotless {
	java {
		target 'src/**/*.java'
		googleJavaFormat()
		removeUnusedImports()
	}
}

checkstyle {
	toolVersion = '10.21.0'
	configFile = file("config/checkstyle/checkstyle.xml")
	ignoreFailures = false
	maxWarnings = 0
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

// Installs the versioned git hooks (.githooks) for this clone.
tasks.register('installGitHooks', Exec) {
	commandLine 'git', 'config', 'core.hooksPath', '.githooks'
	onlyIf { file('.git').exists() }
	ignoreExitValue = true
}

tasks.named('compileJava') {
	dependsOn tasks.named('installGitHooks')
}
