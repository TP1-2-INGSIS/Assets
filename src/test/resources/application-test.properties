# Perfil de test: DB en memoria (H2) y almacenamiento de blobs en memoria.
# No requiere PostgreSQL ni Azurite para ejecutarse.
spring.datasource.url=jdbc:h2:mem:assets;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

azure.storage.container=snippets
