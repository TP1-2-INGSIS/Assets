spring.application.name=assets
server.port=8080

# --- PostgreSQL / JPA ---
# Local por defecto; en Docker Compose se sobreescriben con SPRING_DATASOURCE_* .
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assets}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:assets}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:assets}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Azure Blob Storage ---
# Local (Azurite): la connection string es pública y puede ir en el repo.
# En producción se inyecta por variable de entorno / secret manager.
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
azure.storage.container=${AZURE_STORAGE_CONTAINER:snippets}
